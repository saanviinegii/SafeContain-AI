# ==============================================================================
# SafeContain AI — Render Blueprint Infrastructure-as-Code Configuration
# Deploy directly at: https://dashboard.render.com/blueprints
# ==============================================================================
version: "1"

services:
  # ----------------------------------------------------------------------------
  # SafeContain AI Full-Stack Unified Service
  # Runs FastAPI + React Enterprise Console on Render Container Cloud
  # ----------------------------------------------------------------------------
  - type: web
    name: safecontain-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # Can be upgraded to starter or standard via Render Dashboard
    region: oregon # Available: oregon, ohio, virginia, frankfurt, singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GRAPH_BACKEND
        value: dual
      # Neo4j AuraDB Configuration (Configure in Render Dashboard for Live Graph)
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      # EVM Blockchain Testnet Configuration (Optional)
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        value: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: AUDIT_LEDGER_STORAGE_PATH
        value: "/app/data/audit_ledger.jsonl"
      - key: VERIFY_AUDIT_INTEGRITY_ON_STARTUP
        value: "true"
      - key: SECRET_KEY
        generateValue: true
