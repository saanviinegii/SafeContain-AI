[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safecontain-ai"
version = "1.0.0"
description = "Uncertainty-Aware, Graph-Based Cybersecurity Response Planning, Optimization, Simulation, and Decision-Intelligence Platform"
authors = [{ name = "SafeContain AI Systems Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "networkx>=3.3",
    "ortools>=9.10.0",
    "neo4j>=5.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

