version: '3.8'

services:
  # SafeContain AI FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: safecontain-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - GRAPH_BACKEND=dual
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=SafeContainSecurePassword2026!
      - DATABASE_URL=postgresql://safecontain:PostgresSecurePassword2026!@postgres:5432/safecontain_db
      - AUDIT_LEDGER_STORAGE_PATH=/data/audit_ledger.jsonl
    volumes:
      - backend-data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - safecontain-network

  # SafeContain AI Enterprise Web Console
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: safecontain-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - safecontain-network

  # Neo4j Enterprise Graph Engine
  neo4j:
    image: neo4j:5.20-community
    container_name: safecontain-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/SafeContainSecurePassword2026!
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - safecontain-network

  # PostgreSQL Relational Metadata Database
  postgres:
    image: postgres:16-alpine
    container_name: safecontain-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=safecontain
      - POSTGRES_PASSWORD=PostgresSecurePassword2026!
      - POSTGRES_DB=safecontain_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safecontain -d safecontain_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safecontain-network

volumes:
  backend-data:
  neo4j-data:
  neo4j-logs:
  postgres-data:

networks:
  safecontain-network:
    driver: bridge
