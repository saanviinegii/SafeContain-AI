apiVersion: apps/v1
kind: Deployment
metadata:
  name: safecontain-backend
  labels:
    app.kubernetes.io/name: safecontain-backend
    app.kubernetes.io/part-of: safecontain-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safecontain-backend
  template:
    metadata:
      labels:
        app: safecontain-backend
    spec:
      containers:
        - name: backend
          image: safecontain/backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: safecontain-config
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safecontain-frontend
  labels:
    app.kubernetes.io/name: safecontain-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safecontain-frontend
  template:
    metadata:
      labels:
        app: safecontain-frontend
    spec:
      containers:
        - name: frontend
          image: safecontain/frontend:1.0.0
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
